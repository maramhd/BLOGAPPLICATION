{% extends "base.html" %}
{% block title %}Server Error - Blog{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <div style="font-size: 100px; color: #dc3545; margin-bottom: 20px;">
        <i class="bi bi-exclamation-triangle"></i>
      </div>

      <h1 class="display-1 text-danger">500</h1>
      <h2>Internal Server Error</h2>

      <p class="lead mt-3">
        Oops! Something went wrong on our end.
      </p>

      <p class="text-muted mb-4">
        Our team has been notified of this error. Please try again later.
      </p>

      <a href="{% url 'blog:home' %}" class="btn btn-primary btn-lg">
        <i class="bi bi-house"></i> Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
