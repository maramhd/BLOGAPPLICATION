{% extends "base.html" %}

{% block title %}Password Reset Complete - Blog{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body text-center">
          <div style="font-size: 48px; margin-bottom: 20px; color: #28a745;">
            
          </div>
          
          <h2 class="card-title mb-3">Password Reset Complete</h2>
          
          <p class="text-muted mb-4">
            Your password has been successfully reset. You can now log in with your new password.
          </p>

          <a href="{% url 'blog:login' %}" class="btn btn-primary btn-lg">
            Go to Login
          </a>

          <hr class="my-4">

          <p class="text-muted small">
            <a href="{% url 'blog:home' %}">Back to Home</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
