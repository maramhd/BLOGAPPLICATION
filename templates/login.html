{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0"><i class="fas fa-sign-in-alt"></i> Login</h4>
        </div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <label for="id_username">Username</label>
              <input type="text" name="username" class="form-control" placeholder="Enter username" required id="id_username">
            </div>
            <div class="form-group">
              <label for="id_password">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Password" required id="id_password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
          </form>
        </div>
        <div class="card-footer text-center">
          <small>Don't have an account? <a href="{% url 'blog:register' %}">Register</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
