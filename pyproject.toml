[project]
name = "blogapplication"
version = "0.1.0"
description = "Production-ready Django blog application with JWT authentication, REST API, and containerization"
authors = [
    {name = "maram", email = "maramalhaddad123456@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.14,<6.0.0",
    "python-decouple>=3.8,<4.0",
    "djangorestframework>=3.14.0,<4.0.0",
    "djangorestframework-simplejwt>=5.5.1,<6.0.0",
    "django-filter>=24.1,<25.0",
    "django-cors-headers>=4.3.1,<5.0.0",
    "django-redis>=5.4.0,<6.0.0",
    "Pillow>=12.2.0,<13.0.0",
    "gunicorn>=21.2.0,<22.0.0",
    "redis>=5.0.1,<6.0.0",
    "requests>=2.31.0,<3.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "cryptography>=42.0.5,<43.0.0",
]

[tool.poetry]
packages = [{include = "blogapplication", from = "BlogProject"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
